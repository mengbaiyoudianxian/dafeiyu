<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>心情控制中心</title>
    <style>
      :root { --bg:#0f1420; --panel:#161d2c; --line:#263147; --text:#e6ebf5; --muted:#8d99b0; --accent:#4f8cff; --ok:#3ecf8e; --warn:#f5b84d; --bad:#ff6b6b; }
      @media (prefers-color-scheme: light) { :root { --bg:#f5f7fb; --panel:#fff; --line:#dde3ee; --text:#1b2333; --muted:#66738c; } }
      * { box-sizing: border-box; }
      body { margin:0; background:var(--bg); color:var(--text); font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif; }
      .shell { max-width:1200px; margin:0 auto; padding:20px 16px 40px; }
      h1 { margin:0 0 4px; font-size:22px; } .muted { color:var(--muted); font-size:13px; }
      .grid { display:grid; grid-template-columns:340px 1fr; gap:14px; margin-top:14px; }
      @media (max-width:900px) { .grid { grid-template-columns:1fr; } }
      .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; min-width:0; margin-bottom:14px; }
      .card h2 { margin:0 0 10px; font-size:16px; }
      .bar { margin:7px 0; } .lab { display:flex; justify-content:space-between; font-size:13px; }
      .track { position:relative; height:8px; border-radius:5px; background:var(--line); overflow:hidden; margin-top:3px; }
      .fill { height:100%; border-radius:5px; } .base { position:absolute; top:0; bottom:0; width:2px; background:var(--muted); }
      .person { border-top:1px solid var(--line); padding:10px 0; }
      .person .top { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
      .dims { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin:6px 0; }
      @media (max-width:600px) { .dims { grid-template-columns:repeat(3,1fr); } }
      .dim { font-size:12px; color:var(--muted); } .dim b { display:block; color:var(--text); font-size:14px; }
      .ev { font-size:12px; color:var(--muted); } .ev .p { color:var(--ok); } .ev .n { color:var(--bad); }
      ul { list-style:none; margin:0; padding:0; max-height:420px; overflow:auto; } li { border-top:1px solid var(--line); padding:5px 0; font-size:13px; }
      button { border:1px solid var(--line); background:transparent; color:var(--text); border-radius:9px; padding:6px 12px; cursor:pointer; }
    </style>
  </head>
  <body>
    <main class="shell">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><h1>心情控制中心</h1><div class="muted">她的模拟情绪和人际关系：随聊天、群里气氛、时间、钱包变化。竖线是此刻的基线。</div></div>
        <button id="refresh">刷新</button>
      </div>
      <section class="grid">
        <div>
          <article class="card">
            <h2>她现在</h2>
            <div id="mood" style="font-weight:600"></div>
            <div class="muted" id="why"></div>
            <div id="emo"></div>
          </article>
          <article class="card">
            <h2>最近的变化</h2>
            <ul id="log"></ul>
          </article>
        </div>
        <article class="card">
          <h2>她和每个人</h2>
          <div id="users"></div>
        </article>
      </section>
    </main>
    <script type="module">
      const bridge = window.AstrBotPluginPage;
      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const COLORS = { joy:"var(--ok)", proud:"var(--ok)", shy:"#f08fc0", arousal:"#e86aa8", anger:"var(--bad)", annoyed:"var(--bad)", sad:"#8fa8ff", lonely:"#8fa8ff", jealous:"var(--warn)", worry:"var(--warn)", bored:"var(--muted)" };
      async function load() {
        let r = await bridge.apiGet("page/status", {});
        if (r && "ok" in r) r = r.data || {};
        $("mood").textContent = r.mood;
        $("why").textContent = r.why ? "因为 " + r.why : "";
        $("emo").innerHTML = r.emo.concat([{ key: "energy", name: "精力", v: r.energy, base: null }]).map((e) =>
          `<div class="bar"><div class="lab"><span>${e.name}</span><span>${Math.round(e.v)}</span></div>
           <div class="track"><div class="fill" style="width:${e.v}%;background:${COLORS[e.key] || "var(--accent)"}"></div>
           ${e.base != null ? `<div class="base" style="left:${e.base}%"></div>` : ""}</div></div>`).join("");
        $("users").innerHTML = r.users.length ? r.users.map((u) => `<div class="person">
            <div class="top"><b>${esc(u.name)}</b><span>综合好感 <b style="color:${u.overall >= 70 ? "var(--ok)" : u.overall < 40 ? "var(--bad)" : "inherit"}">${u.overall}</b> · ${esc(u.level)} · 聊过 ${u.count} 次 · <span class="muted">${esc(u.last)}</span></span></div>
            <div class="dims">${Object.entries(u.rel).map(([k, v]) => `<div class="dim">${esc(r.rel_names[k])}<b>${Math.round(v)}</b></div>`).join("")}</div>
            ${u.impression ? `<div class="muted">印象：${esc(u.impression)}</div>` : ""}
            ${u.events.length ? `<div class="ev">${u.events.map((e) => `<span class="${e.w > 0 ? "p" : e.w < 0 ? "n" : ""}">${esc(e.ago)}${esc(e.text)}</span>`).join(" · ")}</div>` : ""}
          </div>`).join("") : '<p class="muted">还没认识谁，跟她聊几句就有了</p>';
        $("log").innerHTML = r.log.map((i) => `<li><span class="muted">${esc(i.time)}</span> ${esc(i.text)}</li>`).join("") || '<li class="muted">还没有变化</li>';
      }
      await bridge.ready();
      $("refresh").onclick = load;
      load();
    </script>
  </body>
</html>
